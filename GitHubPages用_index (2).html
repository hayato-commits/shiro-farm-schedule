<title>しろう農園</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#D8E8CC;
  --ink:#3F4B3A;
  --sub:#7D8676;
  --line:#ACB9A3;
  --accent:#C67842;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
html,body{height:100%;margin:0}
body{
  background:#EFEFE9;
  color:var(--ink);
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
#app{
  position:relative;width:100%;max-width:460px;margin:0 auto;height:100dvh;
  background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
}
@media (min-width:520px){
  body{background:#E7E7E0;padding:16px 0}
  #app{height:calc(100dvh - 32px);border-radius:26px;box-shadow:0 18px 60px rgba(63,75,58,.18)}
}

/* pager */
#pager{
  flex:1 1 auto;display:flex;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#pager::-webkit-scrollbar{display:none}
.page{
  flex:0 0 100%;width:100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;
  display:flex;flex-direction:column;
  padding:calc(var(--safe-t) + 26px) 20px 12px;overflow:hidden;
}

/* header */
.hd{display:flex;align-items:flex-start;gap:2px;flex:0 0 auto}
.bouquet{flex:0 0 auto;width:74px;margin:-0.5px 0 0 -4px}
.bouquet svg{width:100%;height:auto;display:block}
.ym{flex:0 0 auto;text-align:left;padding-top:2px}
.ym .y{font-size:15px;letter-spacing:.18em;color:var(--ink);margin-left:8px}
.ym .m{font-size:54px;line-height:.94;letter-spacing:.01em;margin-top:1px}
.ym .en{font-size:15px;font-style:italic;color:var(--accent);letter-spacing:.02em;margin-top:3px;margin-left:2px}
.title-wrap{flex:0 0 auto;display:block;padding-top:11px;padding-left:4px;min-width:0;overflow:hidden}
.title{font-size:14.5px;letter-spacing:.03em;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* name picker (subtitle slot) */
.namebox{position:relative;display:flex;align-items:center;margin-top:8px;
  border:1px solid var(--line);border-radius:10px;height:34px;padding:0 26px 0 11px;
  background:rgba(255,255,255,.22)}
.namebox .lb{flex:0 0 auto;font-size:10.5px;letter-spacing:.12em;color:var(--sub);padding-right:8px}
.namebox .lb::after{content:"";display:inline-block;width:1px;height:12px;background:var(--line);
  vertical-align:-2px;margin-left:8px}
.namebox select{flex:1 1 auto;min-width:0;width:100%;appearance:none;-webkit-appearance:none;
  background:transparent;border:0;outline:0;font-family:inherit;font-size:13.5px;letter-spacing:.04em;
  color:var(--ink);padding:0;text-overflow:ellipsis;cursor:pointer}
.namebox select.empty{color:var(--sub)}
.namebox .chev{position:absolute;right:11px;top:50%;width:7px;height:7px;margin-top:-5px;
  border-right:1px solid var(--sub);border-bottom:1px solid var(--sub);transform:rotate(45deg);pointer-events:none}
/* grid */
.wrap{flex:1 1 auto;display:flex;flex-direction:column;margin-top:14px;
  border:1px solid var(--line);border-radius:14px;padding:10px 8px 8px;min-height:0}
.dows{display:grid;grid-template-columns:repeat(7,1fr);flex:0 0 auto;padding-bottom:7px}
.dows span{text-align:center;font-size:12.5px;letter-spacing:.1em;color:var(--ink)}
.dows span.sun{color:var(--accent)}.hol{color:var(--accent)}
.grid{flex:1 1 auto;display:grid;grid-template-columns:repeat(7,1fr);
  grid-template-rows:repeat(6,minmax(0,1fr));min-height:0}
.cell{display:flex;align-items:flex-start;justify-content:center;
  border-top:1px solid var(--line);border-left:1px solid var(--line);
  padding-top:8px;position:relative;cursor:pointer}
.cell:nth-child(7n+1){border-left:0}
.cell.n{font-size:16px;letter-spacing:.02em}
.cell.out{color:var(--sub);opacity:.55}
.cell.sun{color:var(--accent)}.hol{color:var(--accent)}
.cell.today{font-weight:700}
.cell.today::after{content:"";position:absolute;left:50%;transform:translateX(-50%);
  bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--accent)}

/* memo（今日のメモ・入力可） */
.memo{flex:0 0 auto;margin-top:12px;border:1px solid var(--line);border-radius:10px;
  padding:20px 12px 12px;position:relative;min-height:64px}
.memo .lb{position:absolute;top:-9px;left:12px;background:var(--bg);padding:0 8px;
  font-size:11px;letter-spacing:.14em;color:var(--sub)}
.memo textarea{width:100%;border:0;outline:0;background:transparent;resize:none;
  font-family:inherit;font-size:13.5px;letter-spacing:.03em;color:var(--ink);
  line-height:1.6;min-height:42px;display:block}
.memo textarea::placeholder{color:var(--line)}
#syncfab,#syncpanel{display:none!important;visibility:hidden!important;pointer-events:none!important}

/* sync (共有) */
#syncfab{position:fixed;right:14px;bottom:calc(14px + var(--safe-b));z-index:30;
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.9);color:var(--ink);font-family:inherit;
  font-size:10px;letter-spacing:.05em;box-shadow:0 2px 8px rgba(63,75,58,.18);cursor:pointer}
#syncpanel{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);
  border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:18px 18px calc(18px + var(--safe-b));
  transform:translateY(105%);transition:transform .25s;box-shadow:0 -6px 24px rgba(63,75,58,.15)}
#syncpanel.on{transform:none}
#syncpanel h3{margin:0 0 8px;font-size:13px;letter-spacing:.08em;font-weight:600;color:var(--ink)}
#syncpanel p{margin:0 0 10px;font-size:10.5px;line-height:1.7;color:var(--sub)}
#syncpanel input{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;
  padding:9px 10px;font-family:inherit;font-size:12px;color:var(--ink)}
#syncpanel .row{display:flex;gap:8px;margin-top:10px}
#syncpanel button{flex:1;border:1px solid var(--line);border-radius:8px;background:#fff;
  padding:9px 6px;font-family:inherit;font-size:11.5px;letter-spacing:.05em;color:var(--ink);cursor:pointer}
#syncpanel button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
#syncst{margin-top:8px;font-size:10.5px;color:var(--sub);min-height:1.4em}
#syncst.ok{color:var(--ink)}
#syncst.err{color:#B4542E}
#syncst .spin{display:inline-block;width:10px;height:10px;border:2px solid var(--line);
  border-top-color:var(--ink);border-radius:50%;margin-right:6px;vertical-align:-1.5px;
  animation:syncsp .7s linear infinite}
@keyframes syncsp{to{transform:rotate(360deg)}}
#syncfab.busy{animation:fabp 1.1s ease-in-out infinite}
@keyframes fabp{0%,100%{box-shadow:0 2px 8px rgba(63,75,58,.18)}50%{box-shadow:0 0 0 7px rgba(198,120,66,.16)}}
#syncclose{position:absolute;top:10px;right:12px;border:0;background:none;font-size:18px;color:var(--sub);cursor:pointer}


/* arrows / hint */
.arrow{position:absolute;top:46%;transform:translateY(-50%);width:36px;height:36px;
  border-radius:50%;border:1px solid var(--line);background:rgba(216,232,204,.9);
  display:flex;align-items:center;justify-content:center;color:var(--ink);
  opacity:.5;transition:opacity .2s;z-index:6;cursor:pointer}
.arrow:active{opacity:1}
.arrow.l{left:6px}.arrow.r{right:6px}
.arrow svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
#hint{position:absolute;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);
  background:rgba(63,75,58,.9);color:#D8E8CC;font-size:11.5px;letter-spacing:.04em;
  padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s;
  white-space:nowrap;z-index:9}
#hint.on{opacity:1}

/* day view */
.cell:active{background:rgba(255,255,255,.45)}
.cell .tags{position:absolute;left:3px;right:3px;bottom:4px;display:flex;flex-direction:column;
  gap:2px;pointer-events:none;z-index:9}
.cell .wtag{text-align:center;font-size:8.5px;line-height:1.35;letter-spacing:0;color:var(--ink);
  background:rgba(255,255,255,.6);border-radius:7px;padding:2px 1px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cell .ttag{text-align:center;font-size:8.5px;line-height:1.35;letter-spacing:0;color:#C67842;
  background:rgba(255,255,255,.6);border-radius:7px;padding:2px 1px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
.cell.today .tags{bottom:12px}
#day{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(var(--safe-t) + 26px) 20px calc(14px + var(--safe-b));opacity:0;pointer-events:none;
  transform:translateY(14px);transition:opacity .22s,transform .22s}
#day.on{opacity:1;pointer-events:auto;transform:none}
.dv-top{flex:0 0 auto;display:flex;align-items:flex-start;gap:8px}
.dv-back{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:rgba(216,232,204,.9);color:var(--ink);display:flex;align-items:center;
  justify-content:center;cursor:pointer;margin-top:6px;padding:0}
.dv-back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.dv-hd{flex:1 1 auto;min-width:0;padding-left:8px}
.dv-ym{font-size:12.5px;letter-spacing:.18em;color:var(--ink)}
.dv-title{font-size:33px;line-height:1.12;margin-top:1px;letter-spacing:.01em}
.dv-title .dv-dow{font-size:14px;letter-spacing:.06em;margin-left:5px;color:var(--ink)}
.dv-title .dv-dow.sun{color:var(--accent)}.hol{color:var(--accent)}
.dv-name{display:inline-block;margin-top:7px;font-size:10.5px;letter-spacing:.1em;color:var(--sub);
  border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.dv-wrap{flex:1 1 auto;position:relative;margin-top:14px;border:1px solid var(--line);
  border-radius:10px;padding:14px 4px 4px;min-height:0;display:flex;flex-direction:column}
.dv-wrap .lb{position:absolute;top:-9px;left:12px;background:var(--bg);padding:0 8px;
  font-size:11px;letter-spacing:.14em;color:var(--sub)}
.dv-list{flex:1 1 auto;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.dv-row{display:flex;align-items:stretch;border-top:1px solid var(--line);min-height:40px}
.dv-row:first-child{border-top:0}
.dv-time{flex:0 0 54px;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;letter-spacing:.05em;color:var(--sub);border-right:1px solid var(--line)}
.dv-list.sun .dv-time{color:var(--accent)}
.dv-selwrap{flex:1 1 50%;display:flex;align-items:center;position:relative;min-width:0;
  border-right:1px solid var(--line);background:rgba(255,255,255,.38)}
.dv-memowrap{flex:1 1 50%;display:flex;align-items:center;min-width:0}
.dv-mem{flex:1 1 auto;width:100%;border:0;outline:0;background:transparent;font-family:inherit;
  font-size:13.5px;letter-spacing:.03em;color:var(--ink);padding:9px 12px;min-width:0}
.dv-mem::placeholder{color:var(--line)}
.dv-note{flex:0 0 auto;margin-top:9px;text-align:center;font-size:10.5px;letter-spacing:.06em;color:var(--sub)}

/* タスク欄（氏名別に表示） */
.dv-tasks{flex:0 0 auto;margin-top:10px;border:1px solid var(--line);border-radius:10px;
  padding:18px 4px 4px;position:relative;display:none}
.dv-tasks.on{display:block}
.dv-tasks .lb{position:absolute;top:-9px;left:12px;background:var(--bg);padding:0 8px;
  font-size:11px;letter-spacing:.14em;color:var(--sub)}
.dv-tw{border-top:1px solid var(--line)}
.dv-tw:first-child{border-top:0}
.dv-task{display:flex;align-items:center;gap:9px;padding:8px 10px;
  font-size:13.5px;letter-spacing:.03em;line-height:1.4}
.dv-task.none{color:var(--sub);font-size:12px;border-top:1px solid var(--line)}
.dv-task.none{cursor:pointer}
.dv-taskadd{cursor:pointer}
.tadd-lb{flex:1 1 auto;font-size:13.5px;letter-spacing:.03em;color:var(--sub);
  padding:9px 10px 9px 0;min-width:0}
.dv-minp{flex:1 1 auto;border:0;outline:0;background:transparent;font-family:inherit;
  font-size:13.5px;letter-spacing:.03em;color:var(--ink);padding:9px 10px 9px 0;min-width:0}
.dv-minp::placeholder{color:var(--line)}
.dv-ck{flex:0 0 18px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);
  cursor:pointer;background:rgba(255,255,255,.4);position:relative}
.dv-task.done .dv-ck{background:var(--accent);border-color:var(--accent)}
.dv-task.done .dv-ck::after{content:"";position:absolute;left:5px;top:5px;width:6px;height:3px;
  border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg)}
.dv-task .tt{flex:1 1 auto;min-width:0;word-break:break-word}
.dv-task.done .tt{color:var(--sub);text-decoration:line-through}
.dv-del{flex:0 0 22px;width:22px;height:22px;text-align:center;color:var(--sub);cursor:pointer;font-size:15px}
.dv-taskadd{display:flex;align-items:center;border-top:1px solid var(--line)}
.dv-taskadd .plus{flex:0 0 34px;text-align:center;color:var(--sub);font-size:15px}
.dv-tin{flex:1 1 auto;border:0;outline:0;background:transparent;font-family:inherit;
  font-size:13.5px;letter-spacing:.03em;color:var(--ink);padding:9px 10px 9px 0;min-width:0}
.dv-tin::placeholder{color:var(--line)}

/* 作業選択ボックス（左半分）＋メモ欄（右半分） */
.dv-sel{flex:1 1 auto;width:100%;min-height:40px;appearance:none;-webkit-appearance:none;border:0;
  outline:0;background:transparent;font-family:inherit;font-size:13.5px;letter-spacing:.03em;
  color:var(--ink);padding:9px 26px 9px 12px;cursor:pointer;text-overflow:ellipsis}
.dv-sel.empty{color:var(--sub)}
.dv-selwrap .chev{position:absolute;right:10px;top:50%;width:7px;height:7px;margin-top:-5px;
  border-right:1px solid var(--sub);border-bottom:1px solid var(--sub);transform:rotate(45deg);pointer-events:none}
  .dv-sel.draghit{background:rgba(110,150,100,.32)!important;}
</style>
</head>
<body>
<div id="app">
  <div id="pager"></div>
  <button class="arrow l" id="prev" aria-label="前の月"><svg viewBox="0 0 24 24"><path d="M15 19 8 12l7-7"/></svg></button>
  <button class="arrow r" id="next" aria-label="次の月"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
  <div id="hint">左右にスワイプで月を移動</div>

  <div id="day" aria-hidden="true">
    <div class="dv-top">
      <button class="dv-back" id="dv-back" aria-label="カレンダーへ戻る"><svg viewBox="0 0 24 24"><path d="M15 19 8 12l7-7"/></svg></button>

        <div class="dv-ym" id="dv-ym"></div>
        <div class="dv-title" id="dv-title"></div>

    <div class="dv-note" id="dv-note">左のボックスで作業を選択、右にメモを入力できます（端末内に保存）</div>
  </div>
</div>

      +'<input id="syncurl" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(syncURL)+'">'
      +'<div class="row"><button type="button" class="pri" id="syncsave">保存して同期</button>'
      +'<button type="button" id="syncpull">取得</button>'
      +'<button type="button" id="syncclear">解除</button></div>'
      +'<div id="syncst"></div>';
    document.body.appendChild(pn);
    fab.addEventListener("click",function(){pn.classList.add("on");});
    document.getElementById("syncclose").addEventListener("click",function(){pn.classList.remove("on");});
    document.getElementById("syncsave").addEventListener("click",function(){
      syncURL=document.getElementById("syncurl").value.trim();

      syncPull();
    });
    document.getElementById("syncpull").addEventListener("click",syncPull);
    document.getElementById("syncclear").addEventListener("click",function(){
      syncURL="";try{localStorage.removeItem(SYNC_KEY);}catch(e){}
      document.getElementById("syncurl").value="";syncSt("共有を解除しました");

  })();
  if(syncOn())setTimeout(syncPull,400);
  setInterval(function(){
    if(syncOn()&&!document.hidden&&!syncBusy&&!editingBusy())syncPull(true);
  },5000);
  document.addEventListener("focusout",function(){
    if(pendingMerged&&!editingBusy()){pendingMerged=false;applyMerged();}
  });

  var pages=pager.children;
  var BASE=(CURRENT.y-START_Y)*12+(CURRENT.m-START_M);   // 2026年11月

  function pageW(){
    var w=pages[0].getBoundingClientRect().width;
    return w>10?w:pager.clientWidth;
  }
  function idxNow(){
    return Math.round(pager.scrollLeft/pageW());
  }
  function goto(idx){
    idx=Math.max(0,Math.min(pages.length-1,idx));
    pager.scrollTo({left:idx*pageW(),behavior:"smooth"});
  }
  function settle(){
    pager.scrollLeft=BASE*pageW();
  }

  settle();
  requestAnimationFrame(settle);
  window.addEventListener("load",settle);
  setTimeout(settle,120);
  setTimeout(settle,400);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(settle);}

  document.getElementById("prev").addEventListener("click",function(){goto(idxNow()-1);});
  document.getElementById("next").addEventListener("click",function(){goto(idxNow()+1);});

  document.addEventListener("keydown",function(e){
    if(e.key==="ArrowLeft")goto(idxNow()-1);
    if(e.key==="ArrowRight")goto(idxNow()+1);
  });

  var rt;
  window.addEventListener("resize",function(){
    clearTimeout(rt);
    rt=setTimeout(function(){pager.scrollLeft=idxNow()*pageW();},150);
  });

  /* 初回のみヒント */
  var hint=document.getElementById("hint");
  setTimeout(function(){hint.classList.add("on");},700);
  setTimeout(function(){hint.classList.remove("on");},3600);
  pager.addEventListener("scroll",function(){hint.classList.remove("on");},{once:true});
})();
</script>
